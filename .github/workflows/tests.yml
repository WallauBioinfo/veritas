name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: black (format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install black
        run: pip install black==25.9.0

      - name: Check formatting
        run: black --check .

  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    defaults:
      run:
        shell: bash -el {0}   # ensures conda env is activated in every step

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env.yaml
          environment-name: veritas
          cache-environment: true
          cache-downloads: true

      - name: Install veritas (editable)
        run: pip install -e ".[dev]" --no-deps

      - name: Run unit and integration tests (no external tools required)
        run: |
          pytest tests/ -v \
            --tb=short \
            -m "not requires_rtg and not requires_gsalign" \
            --cov=veritas \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Run tests requiring RTG Tools
        if: success() || failure()
        run: |
          pytest tests/ -v \
            --tb=short \
            -m "requires_rtg" \
            --cov=veritas \
            --cov-report=xml:coverage_rtg.xml \
        continue-on-error: true

      - name: Run tests requiring GSAlign
        if: success() || failure()
        run: |
          pytest tests/ -v \
            --tb=short \
            -m "requires_gsalign" \
            --cov=veritas \
            --cov-report=xml:coverage_gsalign.xml \
        continue-on-error: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
