[pytest]
# Pytest configuration for Veritas

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for CLI commands
    slow: Tests that may take longer to run
    requires_rtg: Tests that require RTG Tools
    requires_gsalign: Tests that require GSAlign

